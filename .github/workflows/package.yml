name: Package

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  source-package:
    name: Source package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          OMR_SESSION_SECRET: ci-session-secret
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: Create deployment archive
        env:
          ARCHIVE_NAME: omrchecker-${{ github.sha }}.tar.gz
        run: |
          mkdir -p dist
          tar \
            --exclude-vcs \
            --exclude='./output' \
            --exclude='./tmp' \
            --exclude='*.bak' \
            --exclude='./.venv' \
            --exclude='./.pytest_cache' \
            -czf "dist/${ARCHIVE_NAME}" .
          sha256sum "dist/${ARCHIVE_NAME}" > "dist/${ARCHIVE_NAME}.sha256"

      - name: Upload deployment archive
        uses: actions/upload-artifact@v4
        with:
          name: omrchecker-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  container-images:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: backend
            dockerfile: Dockerfile.backend
          - image: frontend
            dockerfile: Dockerfile.frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/omrchecker-${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max