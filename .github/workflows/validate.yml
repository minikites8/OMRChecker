name: Validate

on:
  push:
    branches:
      - "**"
    paths:
      - "**/*.py"
      - "ui/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: [master]
    paths:
      - "**/*.py"
      - "ui/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: Backend and frontend smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q backend platform_auth.py platform_config.py platform_cos.py platform_database.py platform_persistence.py scan_ui.py

      - name: Backend import smoke test
        run: python -c "import backend.app; print('BACKEND_IMPORT_OK', backend.app.app.title)"

      - name: Scan UI self test
        env:
          OMR_AUTH_MODE: disabled
          OMR_PERSISTENCE_MODE: local
          OMR_DATA_ROOT: ${{ runner.temp }}/omrchecker-data
        run: python scan_ui.py --self-test

      - name: Frontend tests
        run: |
          node ui/tests/candidates.test.cjs
          node ui/tests/objective-view.test.cjs
          node ui/tests/platform.test.cjs
          node ui/tests/subjective-view.test.cjs